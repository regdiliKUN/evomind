# 全量验收：静态检查 + Python 快速回归与 unittest + 前端测试。
# 对应 AUDIT_REVIEW.md §10 P1「无 CI / 无静态检查」。
# 与本机一致用 Windows + Python 3.13；测试全部走临时数据目录、--fast 模式不访问外网与 Ollama。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 静态检查（语法 / 未定义名称 / 前端语法）
        run: |
          python -m compileall -q backend run.py tests scripts
          python scripts/lint_names.py
          node --check web/app.js

      - name: Python 全量验收（快速回归 + unittest）
        run: python tests/run_all.py

      - name: 前端测试
        run: node --test tests/frontend_tests.cjs
